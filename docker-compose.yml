services:
  backend:
    build:
      context: ./API
      dockerfile: Dockerfile
    container_name: fantasy-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./API/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
    networks:
      - fantasy-network

  frontend:
    build:
      context: ./UI
      dockerfile: Dockerfile
    container_name: fantasy-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      - backend
    networks:
      - fantasy-network

networks:
  fantasy-network:
    driver: bridge
